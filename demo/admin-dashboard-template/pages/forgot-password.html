<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Nebula Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81',950:'#1e1b4b' },
                        dark: { 50:'#f8fafc',100:'#f1f5f9',200:'#e2e8f0',300:'#cbd5e1',400:'#94a3b8',500:'#64748b',600:'#475569',700:'#334155',800:'#1e293b',900:'#0f172a',950:'#020617' }
                    },
                    fontFamily: { sans: ['Inter','system-ui','sans-serif'] }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-dark-50 dark:bg-dark-950 text-dark-900 dark:text-dark-100 font-sans antialiased">

    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="w-full max-w-md">
            <div class="flex items-center gap-3 mb-8 justify-center">
                <div class="w-10 h-10 rounded-xl bg-primary-600 flex items-center justify-center">
                    <i data-lucide="hexagon" class="w-6 h-6 text-white"></i>
                </div>
                <span class="text-2xl font-bold tracking-tight">Nebula Admin</span>
            </div>

            <div class="card p-8">
                <div class="text-center mb-6">
                    <div class="w-14 h-14 rounded-full bg-primary-100 dark:bg-primary-900/30 mx-auto flex items-center justify-center mb-4">
                        <i data-lucide="key-round" class="w-7 h-7 text-primary-600 dark:text-primary-400"></i>
                    </div>
                    <h2 class="text-xl font-bold">Reset your password</h2>
                    <p class="text-dark-500 dark:text-dark-400 mt-2 text-sm">Enter your email and we'll send you a reset link.</p>
                </div>

                <form class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium mb-1.5">Email Address</label>
                        <div class="relative">
                            <i data-lucide="mail" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-dark-400"></i>
                            <input type="email" class="input pl-10" placeholder="you@example.com">
                        </div>
                    </div>
                    <button type="submit" class="btn-primary w-full justify-center">Send Reset Link</button>
                </form>

                <div class="text-center mt-6">
                    <a href="login.html" class="text-sm text-primary-600 dark:text-primary-400 hover:underline font-medium">&larr; Back to sign in</a>
                </div>
            </div>

            <p class="text-center text-xs text-dark-400 dark:text-dark-500 mt-4">
                <a href="../index.html" class="hover:underline">&larr; Back to Dashboard</a>
            </p>
        </div>
    </div>

    <script>if (typeof lucide !== 'undefined') lucide.createIcons();</script>
</body>
</html>
